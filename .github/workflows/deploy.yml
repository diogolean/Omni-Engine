name: Deploy

# Push to main runs Validate first. This workflow starts only after that run
# succeeds, so the Oracle VM and the GHCR tags move for a sha that already
# passed lint, the factory tests, the Aiwake tests, and the secret scan.
# workflow_dispatch still rolls back to an image tag that is already in GHCR
# and does not rebuild.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA (or latest) already in GHCR. Set this to roll back. Empty deploys the current SHA."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: omni-engine-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build arm64 image
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/diogolean/omni-engine:latest
            ghcr.io/diogolean/omni-engine:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/diogolean/Omni-Engine
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

  # Publishes the image only. The VM deploy job does not start this container.
  supermemory-image:
    name: build supermemory arm64 image
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/supermemory
          file: docker/supermemory/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/diogolean/supermemory-server:0.0.9
            ghcr.io/diogolean/supermemory-server:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=supermemory
          cache-to: type=gha,scope=supermemory,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/diogolean/Omni-Engine
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

  deploy:
    name: ssh deploy
    needs: build
    if: >-
      always() && (
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && needs.build.result == 'success'
        )
        || (
          github.event_name == 'workflow_dispatch'
          && needs.build.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            TAG="$HEAD_SHA"
          else
            TAG="$SHA"
          fi
          if ! [[ "$TAG" =~ ^(latest|[0-9a-f]{7,40})$ ]]; then
            echo "Refusing image tag: $TAG" >&2
            exit 1
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Copy compose and deploy
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          known=(-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes)
          ssh -i ~/.ssh/vm_key "${known[@]}" "$VM_USER@$VM_HOST" \
            "mkdir -p /opt/omni-engine/credentials /opt/omni-engine/outputs/logs /opt/omni-engine/scripts /opt/omni-engine/channels_config/ancient_knowledge /opt/omni-engine/channels_config/anna_protocol"
          scp -i ~/.ssh/vm_key "${known[@]}" \
            docker-compose.yml "$VM_USER@$VM_HOST:/opt/omni-engine/docker-compose.yml"
          scp -i ~/.ssh/vm_key "${known[@]}" \
            scripts/backup_supermemory.sh "$VM_USER@$VM_HOST:/opt/omni-engine/scripts/backup_supermemory.sh"
          ssh -i ~/.ssh/vm_key "${known[@]}" "$VM_USER@$VM_HOST" \
            "chmod 755 /opt/omni-engine/scripts/backup_supermemory.sh"
          ssh -i ~/.ssh/vm_key "${known[@]}" "$VM_USER@$VM_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" < .github/scripts/remote-deploy.sh
