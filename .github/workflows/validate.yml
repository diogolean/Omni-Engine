name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt

      - name: Lint
        run: >
          ruff check omni modules/memory
          agents/media/drive_source.py
          agents/media/content_source.py
          agents/posting/pinterest_engine/library_source.py
          scripts/backup_supermemory.py
          scripts/upload_clips_to_b2.py
          agents/media/b2_budget.py
          agents/media/b2_client.py
          tests/test_omni_config.py
          tests/test_omni_publisher.py
          tests/test_pinterest_vm.py
          tests/test_pinterest_publisher_fixes.py
          tests/test_memory_client.py
          tests/test_supermemory_service.py
          tests/test_repo_root_layout.py
          tests/test_b2_budget.py
          tests/test_b2_direct_client_guard.py
          tests/test_upload_clips_b2_budget.py
          tests/test_drive_source.py

      - name: Test
        run: >
          pytest -q
          tests/test_omni_config.py
          tests/test_omni_publisher.py
          tests/test_pinterest_vm.py
          tests/test_pinterest_publisher_fixes.py
          tests/test_memory_client.py
          tests/test_supermemory_service.py
          tests/test_repo_root_layout.py
          tests/test_b2_budget.py
          tests/test_b2_direct_client_guard.py
          tests/test_upload_clips_b2_budget.py
          tests/test_drive_source.py
