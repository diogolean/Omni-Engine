name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check omni tests/test_omni_config.py tests/test_omni_publisher.py tests/test_pinterest_vm.py

      - name: Test
        run: >
          pytest -q
          tests/test_omni_config.py
          tests/test_omni_publisher.py
          tests/test_pinterest_vm.py
          tests/test_repo_root_layout.py
