name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libass9

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt

      - name: Lint
        # Covers the main-branch list too: omni, modules/memory, drive_source,
        # content_source, library_source, the B2 modules, and their tests.
        run: ruff check .

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # Current tree only. A Facebook page token remains in git history;
          # the owner must revoke it and decide on a history purge. This scan
          # stops a new commit from adding another secret.
          /tmp/gitleaks detect --no-git --source . --redact --exit-code 1

      - name: Test
        run: |
          # Whole suite, including the B2, Drive, and Pinterest tests from main
          # (test_b2_budget, test_b2_direct_client_guard, test_drive_source,
          # test_upload_clips_b2_budget, test_pinterest_vm, and the omni tests).
          # Three Ancient Knowledge deselects stay out (shot-variety page id,
          # flux retry, fair-share stills). Their owner will fix them in a
          # small follow-up based on this branch. The visual-QA chain tests
          # run: the default chain is qwen-only and fails closed. The other
          # deselects failed in isolation on the base branch before this refactor.
          pytest -q tests channels_config \
            --deselect tests/test_lofi_emotional_pipeline.py::test_gemini38_provider_uses_only_configured_primary_model \
            --deselect tests/test_shot_variety.py::test_get_image_adapter_accepts_page_id \
            --deselect tests/test_reel_object_beats_and_encode.py::test_pass_one_retry_does_not_call_flux_again \
            --deselect tests/test_reel_still_fair_share.py::test_reel_stills_through_the_main_entry \
            --deselect channels_config/aiwake/tests/test_caption_validator.py::test_truncated_plugs_it_fails \
            --deselect channels_config/aiwake/tests/test_distribution_pipeline.py::test_tiktok_caption_is_hook_quote_trigger \
            --deselect channels_config/aiwake/tests/test_distribution_pipeline.py::test_planner_imports_root_videos_with_optimized_captions \
            --deselect channels_config/aiwake/tests/test_distribution_pipeline.py::test_update_scheduled_touches_private_matches_only \
            --deselect channels_config/aiwake/tests/test_library_audit.py::test_run_audit_moves_rejects_and_exports_clean_planners
