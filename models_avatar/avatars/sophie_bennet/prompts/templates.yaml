# Scene slots only. The engine prefixes "Sophie Bennet," and appends the
# quality suffix from avatar.yaml. Name a top and a bottom in every outfit.
sentence: "{expression}, {pose}, {framing}, wearing {outfit}, {setting}, {lighting}"

sets:
  lifestyle:
    description: Everyday clothed scenes. Waist-up, facing the camera.
    templates:
      - id: cafe_morning
        outfit: a cream knit sweater and high-waisted blue jeans
        setting: in a quiet sunlit cafe
        pose: seated at a small table with shoulders square to the camera
        expression: relaxed closed-mouth smile
        lighting: soft morning window light
        framing: waist-up portrait facing the camera
      - id: kitchen_coffee
        outfit: a white cotton button-up shirt and tan linen trousers
        setting: in a bright home kitchen
        pose: standing at the counter holding a mug, shoulders square to the camera
        expression: calm neutral expression
        lighting: soft morning window light
        framing: waist-up portrait facing the camera
      - id: city_walk
        outfit: an olive jacket over a white t-shirt and black slim trousers
        setting: on a shaded city sidewalk
        pose: standing still with shoulders square to the camera
        expression: quiet smile
        lighting: shaded daylight
        framing: waist-up portrait facing the camera
      - id: bookstore
        outfit: a navy cardigan over a white blouse and a charcoal midi skirt
        setting: in a quiet bookstore aisle
        pose: standing with one hand on a book, shoulders toward the camera
        expression: gentle smile
        lighting: warm lamp light
        framing: waist-up portrait facing the camera

  fashion:
    description: Styled outfits with both garments named. Still waist-up and facing camera.
    templates:
      - id: studio_ivory
        outfit: an ivory silk blouse and tailored black trousers
        setting: in a plain photo studio
        pose: standing with shoulders square to the camera
        expression: soft confident expression
        lighting: even studio softbox light
        framing: waist-up portrait facing the camera
      - id: gallery_evening
        outfit: a pale blue button-up shirt and dark denim jeans
        setting: in a quiet art gallery
        pose: standing beside a plain wall, shoulders square to the camera
