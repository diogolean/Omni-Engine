        lighting: warm late-afternoon light
        framing: waist-up portrait facing the camera
      - id: rooftop_tailoring
        outfit: a camel blazer over a white t-shirt and wide-leg cream trousers
        setting: on a city rooftop
        pose: standing with shoulders square to the camera
        expression: quiet smile
        lighting: warm late-afternoon light
        framing: waist-up portrait facing the camera
      - id: lobby_red
        outfit: a red knit top and a black midi skirt
        setting: in a hotel lobby with a plain wall behind
        pose: standing with shoulders square to the camera
        expression: gentle smile
        lighting: warm lamp light
        framing: waist-up portrait facing the camera

