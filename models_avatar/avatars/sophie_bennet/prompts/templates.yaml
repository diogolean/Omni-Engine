        lighting: soft morning window light
        framing: waist-up portrait facing the camera
      - id: pool_edge
        outfit: a black bikini top and black high-waisted bikini bottoms
        setting: at the edge of a still pool
        pose: standing with shoulders square to the camera
        expression: calm neutral expression
        lighting: warm late-afternoon light
        framing: waist-up portrait facing the camera
      - id: deck_sunset
        outfit: a sage bikini top and sage high-waisted bikini bottoms
        setting: on a wooden deck away from crowds
        pose: standing with shoulders square to the camera
        expression: gentle smile
        lighting: warm late-afternoon light
