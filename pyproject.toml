[tool.ruff.lint.isort]
known-first-party = ["engine", "agents", "utils", "core", "modules", "channels_config", "shared", "distribution", "accounts"]

# ADR 0008 M1. These names are today's packages, standing in for the target
# layers until the moves land. CI runs them in report-only mode; M14 makes
# the same contracts blocking.
#
# shared is the real layer (ADR 0008 M2 and M3). Shims stay until M14.
# shared stand-ins that remain: utils.pipeline_paths, utils.process_tools,
# modules.durable_store, modules.distribution_contract, modules.memory
# animation: core.animator
# production: engine, modules, agents.{media,writer,rag,orchestrator,mcp},
#   models_avatar, core
# distribution: distribution, accounts, and the agents.posting shims
# products.aiwake: channels_config.aiwake
# channels: the other channels_config packages
[tool.importlinter]
root_packages = [
    "agents",
    "channels_config",
    "core",
    "engine",
    "models_avatar",
    "modules",
    "shared",
    "utils",
    "distribution",
    "accounts",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Animation does not import products, distribution, or the factory pipeline"
type = "forbidden"
source_modules = ["core.animator"]
forbidden_modules = [
    "channels_config",
    "distribution",
    "accounts",
    "agents",
    "engine",
    "modules",
    "models_avatar",
]

