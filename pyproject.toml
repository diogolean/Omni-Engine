[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests", "engine", "agents", "core", "modules", "utils", "channels_config", "scripts", "shared", "distribution", "accounts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501: line length was not enforced on the whole tree. E402: bootstrap
# and channel scripts import after path setup. E731/E741: legacy lambdas
# and names. F401, F841, and I001 are not ignored here, so distribution/
# and agents/media/b2_*.py stay on the original rules.
ignore = ["E501", "E402", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Legacy modules. Do not add agents/media/b2_*.py.
"agents/writer/**" = ["F401", "F841", "I001"]
"agents/posting/**" = ["F401", "F841", "I001"]
"agents/orchestrator/**" = ["F401", "F841", "I001"]
"agents/rag/**" = ["F401", "F841", "I001"]
"agents/mcp/**" = ["F401", "F841", "I001"]
"agents/media/avatar_engine/**" = ["F401", "F841", "I001"]
"agents/media/providers/**" = ["F401", "F841", "I001"]
"agents/media/audio_engine.py" = ["F401", "F841", "I001"]
"agents/media/batch_planner.py" = ["F401", "F841", "I001"]
