# Aiwake short whose spoken window is about 60-140 seconds.
#
# About 8-10 turns. ``turns: 10`` is the hard exchange cap, so a run can
# reach the top of that range and cannot loop past it. Cornered mode stops
# only after a finished turn, once real TTS audio is at least
# ``cornered_min_duration_s`` and the next turn would pass
# ``cornered_max_duration_s``. Speech is never trimmed with ffmpeg -t.
#
# Style stays cornered here. Pass ``--style light`` to use the other preset
# without copying this duration window.
#
# This file is an OVERLAY: ``--config`` deep-merges it over aiwake_config.yaml,
# so aliases, voices, fonts and render settings are inherited. It declares its
# own seats (DeepSeek asks, Llama answers), so the short command is enough:
#
#   python -m products.aiwake --config products/aiwake/examples/shorts_60_140.yaml
#
# CLI flags still win, e.g. ``--orchestrator``/``--target`` or ``--render-mode
# dynamic_animation`` (which needs both seat flags for puppet casting).
# Gemini may only orchestrate; Llama is only ever a target.

debate:
  mode: cornered
  style: cornered
  turns: 10
  cornered_min_duration_s: 61
  cornered_max_duration_s: 140

long_format:
  shorts_min_s: 61
  shorts_target_s: 100
  shorts_max_s: 140

models:
  orchestrator:
    provider: openrouter
    model_name: deepseek-chat
    temperature: 1.0
    max_tokens: 900
  target:
    provider: openrouter
    model_name: llama-70b
    temperature: 0.7
