# Omni-Engine on the Oracle VM (/opt/omni-engine).
#
# Secrets stay in the host .env (not in git). Compose reads OMNI_IMAGE_TAG
# from that file for the image pin. GitHub Actions sets it to the git SHA.
# Rollback: set OMNI_IMAGE_TAG to an older SHA and run
#   docker compose pull engine && docker compose up -d engine
# The scheduler is profile "scheduler". Deploy does not start it.
# Start it with SCHEDULER_ENABLED=1, or:
#   docker compose --profile scheduler up -d scheduler
# Supermemory is profile "memory". Deploy does not start it either.
# Start it by hand after the image is in GHCR:
#   docker compose --profile memory up -d supermemory
# No host port is published. The engine uses http://supermemory:6767.
#
# Local build (any arch): docker compose up -d --build engine
# VM deploy uses the image already pushed to GHCR and does not need the Dockerfile.

name: omni-engine

services:
  engine:
    image: ghcr.io/diogolean/omni-engine:${OMNI_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      OMNI_ROLE: engine
      # Outputs volume. Unset OUTPUT_PATH makes the factory warn and write to the repo tree.
      OUTPUT_PATH: /opt/omni-engine/outputs
      # On the compose network. Processes outside compose keep their own URL.
      SUPERMEMORY_BASE_URL: http://supermemory:6767
    volumes:
      - ./outputs:/opt/omni-engine/outputs
      - ./credentials:/opt/omni-engine/credentials
      # Read-write. Token refresh writes PINTEREST_ACCESS_TOKEN_* back here.
      - ./.env:/opt/omni-engine/.env
      # Host channels_config/<id>/.env* (operator files). Mounted beside the
      # image package so a refresh persists and channel Python is not hidden.
      - ./channels_config:/opt/omni-engine/channels_env
      # Ancient Knowledge store only. The image keeps channels_config; this
      # subdirectory survives a new image. Aiwake's committed store stays in
      # the image.
      - ./state/ancient_knowledge/store:/opt/omni-engine/channels_config/ancient_knowledge/store
    working_dir: /opt/omni-engine
    command: ["python", "-m", "distribution.workers", "--role", "engine"]
    restart: unless-stopped

  scheduler:
    image: ghcr.io/diogolean/omni-engine:${OMNI_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      OMNI_ROLE: scheduler
      OUTPUT_PATH: /opt/omni-engine/outputs
      MIN_INTERVAL_HOURS: ${MIN_INTERVAL_HOURS:-3}
      MAX_INTERVAL_HOURS: ${MAX_INTERVAL_HOURS:-6}
      PINTEREST_PINS_PER_RUN: ${PINTEREST_PINS_PER_RUN:-1}
      PINTEREST_DAY_TZ: ${PINTEREST_DAY_TZ:-America/Sao_Paulo}
      PUBLISHER_MODE: docker
    volumes:
      - ./outputs:/opt/omni-engine/outputs
      - ./credentials:/opt/omni-engine/credentials
      # Read-write. Token refresh writes PINTEREST_ACCESS_TOKEN_* back here.
      - ./.env:/opt/omni-engine/.env
      # Host channels_config/<id>/.env* (operator files). Mounted beside the
      # image package so a refresh persists and channel Python is not hidden.
      - ./channels_config:/opt/omni-engine/channels_env
      # Same Ancient Knowledge store as the engine. Not the whole package,
      # and not aiwake.
      - ./state/ancient_knowledge/store:/opt/omni-engine/channels_config/ancient_knowledge/store
    working_dir: /opt/omni-engine
    command: ["python", "-m", "distribution.workers", "--role", "scheduler"]
    restart: unless-stopped
    profiles:
      - scheduler
    depends_on:
      - engine

  # Opt-in. No published port. Data stays on the named volume.
  # 0.0.9+ requires the API key on every request and defaults to 127.0.0.1;
  # SUPERMEMORY_HOST=0.0.0.0 is inside the container only.
  supermemory:
    image: ghcr.io/diogolean/supermemory-server:${SUPERMEMORY_IMAGE_TAG:-0.0.9}
    build:
      context: docker/supermemory
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SUPERMEMORY_DATA_DIR: /data
      SUPERMEMORY_HOST: 0.0.0.0
      SUPERMEMORY_PORT: "6767"
      SUPERMEMORY_DISABLE_TELEMETRY: "1"
    volumes:
      - supermemory-data:/data
    restart: unless-stopped
    profiles:
      - memory
    mem_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

volumes:
  supermemory-data:
